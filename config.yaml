# Project Configuration
project_name: "Plant Disease Detection and Crop Yield Prediction"
dataset: "Bangladeshi Crops Disease Dataset"
num_classes: 15

# Paths
data_dir: "C:/Users/zahra.elghourani/Desktop/Zahra/Plant Disease Detection and Crop Yield Prediction/data/BangladeshiCropsDisease"
checkpoint_dir: "./checkpoints"
results_dir: "./results"

# Image Settings
image_size: [224, 224]
batch_size: 16  # Reduced for RTX 2080 8GB
validation_split: 0.15
test_split: 0.15

# Training Settings
epochs: 50
learning_rate: 0.0001
early_stopping_patience: 10
reduce_lr_patience: 5

# GPU Settings
mixed_precision: true
memory_growth: true

# Model Assignments (38 models divided among 3 people)
models:
  zahra:
    - Xception
    - VGG16
    - ResNet152
    - ResNet152V2
    - MobileNet
    - MobileNetV2
    - EfficientNetB0
    - EfficientNetB1
    - EfficientNetB2
    - EfficientNetV2B0
    - EfficientNetV2S
    - EfficientNetV2M
    - ConvNeXtLarge
    
  sireen:
    - VGG19
    - ResNet50
    - ResNet50V2
    - DenseNet121
    - DenseNet169
    - DenseNet201
    - EfficientNetB3
    - EfficientNetB4
    - EfficientNetB5
    - EfficientNetV2L
    - ConvNeXtTiny
    - ConvNeXtSmall
    
  tala:
    - ResNet101
    - ResNet101V2
    - InceptionV3
    - InceptionResNetV2
    - NASNetMobile
    - NASNetLarge
    - EfficientNetB6
    - EfficientNetB7
    - EfficientNetV2B1
    - EfficientNetV2B2
    - EfficientNetV2B3
    - ConvNeXtBase
    - ConvNeXtXLarge